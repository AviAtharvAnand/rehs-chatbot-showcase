# Placeholder manifest. Put the real ones you applied in your own k8s/ folder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-chatbot
  namespace: rehs-2026-chatbot
spec:
  replicas: 1
  selector:
    matchLabels: {app: example-chatbot}
  template:
    metadata:
      labels: {app: example-chatbot}
    spec:
      containers:
      - name: streamlit
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
        - pip install --quiet streamlit openai &&
          streamlit run /app/app.py --server.address=0.0.0.0 --server.port=8501
        ports:
        - containerPort: 8501
        envFrom:
        - secretRef: {name: nrp-llm-token}
        volumeMounts:
        - {name: code, mountPath: /app}
      volumes:
      - name: code
        configMap: {name: example-chatbot-code}
