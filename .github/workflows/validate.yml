name: Check entries

# Runs on every pull request. If this passes, the entry is ready to merge.
# The messages are written for students — read them, they say what to fix.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check every chatbot folder
        run: python _pages/scripts/validate.py

      - name: Build the site (catches template errors before publishing)
        run: python _pages/scripts/build_site.py
