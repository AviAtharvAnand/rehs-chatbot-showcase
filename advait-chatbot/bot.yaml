name: Advait's NRP Documentation Chatbot

tagline: >
  A retrieval-augmented AI assistant that answers questions about the National
  Research Platform using official documentation sources.

kind: solo
year: 2026

authors:
  - name: Advait Choksi
    github: advaitc31
    role: >
      Built the RAG pipeline, Streamlit interface, embedding workflow,
      ChromaDB vector search system, and Kubernetes deployment.
    learned: >
      This project taught me not only a lot of about python programming with AI and LLMS, but also how to move an AI application from a local Python
      script into a production-style Kubernetes workload. I learned about
      retrieval quality, chunking strategies, embeddings, and deployment techniques.

tech:
  - Streamlit
  - Python
  - ChromaDB
  - Retrieval-Augmented Generation (RAG)
  - qwen3-embedding
  - NRP LLM API
  - Kubernetes
  - Docker

highlights:
  - >
    Built a complete RAG pipeline that automatically scrapes NRP documentation,
    splits it into searchable chunks, creates embeddings, and retrieves relevant
    documentation before generating answers.
  - >
    Designed a Kubernetes deployment with persistent storage for the vector
    database, ConfigMaps for application configuration, and Secrets for secure
    API token management.
  - >
    Improved answer reliability by adding source retrieval, configurable
    response styles, adjustable retrieval depth, and streaming token-by-token
    generation.

