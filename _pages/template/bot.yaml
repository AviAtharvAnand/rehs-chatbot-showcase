tagline: What your chatbot does, in one plain sentence.

kind: solo            # solo | pair | team
year: 2026

authors:
  - name: Your Name
    github: your-github-username
    role: what you actually built (e.g. "ingest and chunking, plus the deployment")
    learned: >
      Two or three honest sentences about what this taught you. The un-polished
      version is the good version. This shows up on your own page.
    # grad_year: 2027

tech:
  - Streamlit
  - ChromaDB
  - NRP LLM (gpt-oss)
  - Kubernetes
  - Python

# 2-5 bullets. The interesting DECISIONS, not a feature list.
